server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The files of a Page are the API's. The proxy in front sends them there, so nothing asks
  # for them here; an address that arrives anyway holds a token and is neither answered with
  # the interface nor written to the access log.
  location /app-content {
    access_log off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
