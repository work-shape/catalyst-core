server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Who may frame the interface: itself only. The API's framed documents take their list from
  # `server/src/http/framing.ts`. A location with its own `add_header` drops the server's, so
  # each location that answers with the interface repeats the two lines.
  set $frame_ancestors "'self'";

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The files of a Page are the API's. The proxy in front sends them there, so nothing asks
  # for them here; an address that arrives anyway holds a token and is neither answered with
  # the interface nor written to the access log.
  location /app-content {
    access_log off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
}
