version: 1
scopes:
  mandant: { label: Mandant, valueType: text }
clientInstance:
  id: demo-e2e
  displayName: Demo E2E Client Instance
  environment: development
# The origin the browser opens the suite's UI on. A shared OAuth sign-in sends the provider back
# to its callback there; connection-sign-in.spec.ts hands that request on to the API.
instance:
  publicUrl: http://127.0.0.1:5273
auth:
  standalone:
    enabled: true
    baseUrl: http://127.0.0.1:4210/api/auth
    trustedOrigins:
      - http://127.0.0.1:5273
    seedUsers:
      - email: e2e-superadmin@example.test
        emailEnvName: E2E_SUPERADMIN_EMAIL
        displayLabel: E2E Superadmin
        passwordEnvName: E2E_SUPERADMIN_PASSWORD
        developmentPassword: e2e-superadmin-password
        roles:
          - user
          - admin
          - superadmin
        permissions:
          - config_assets.release
        permissionRefs:
          - demo-tools
      - email: e2e-user@example.test
        emailEnvName: E2E_USER_EMAIL
        displayLabel: E2E User
        passwordEnvName: E2E_USER_PASSWORD
        developmentPassword: e2e-user-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-admin@example.test
        emailEnvName: E2E_ADMIN_EMAIL
        displayLabel: E2E Admin
        passwordEnvName: E2E_ADMIN_PASSWORD
        developmentPassword: e2e-admin-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      # Each spec's own people are in tests/fixtures/e2e-users/<spec>.yaml. scripts/e2e-config.mjs
      # puts them in place of the next line, in file name order, and refuses an email twice.
      # A spec file that fills its member's conversation list or Inbox has a member of its own:
      # spec files run side by side on this one instance, so a file that shared its member with
      # another pushed the other's rows out of the rail's cap. A new spec's people get labels
      # that start with "E2E Zz": the users list is sorted by label and shows ten rows a page,
      # and `chat-standalone.spec.ts` looks for "E2E Superadmin", "E2E User" and a person it
      # creates as "E2E Reset ..." on the first page.
      # @e2e-users
  sessionToken:
    issuer: demo-e2e-client-instance
    ttlSeconds: 900
retention:
  conversationDays: 1
  auditDays: 30
  allowUserDelete: true
administration:
  agentConfiguration:
    enabled: true
    editableAgentFields:
      - displayName
      - description
      - welcomeMessage
      - welcomeSubtitle
      - instructions
      - modelBindingId
      - reasoningEffort
      - maxSteps
      - toolNames
      - skillNames
      - knowledgeBases
      - initialPrompts
    allowAgentCreation: true
    allowAgentDeletion: true
    allowDefaultAgentChange: true
    allowSkillEditing: true
    agentSkillChanges:
      enabled: true
      allowSkillCreation: true
# Pages are on: the specs about what a Page cannot reach need the route that serves one. A Page
# is saved from an Execution Workspace and built in its sandbox, so those are on too; the local
# sandbox runs the build as a process of the suite's workspace command worker.
modules:
  apps:
    enabled: true
  # Connections are on: Studio lists them and the Access page grants their rights. The suite's
  # server names one connector type, `test`, which contacts nothing.
  connections:
    enabled: true
  # Workflows are on: the Access page grants their rights. The suite seeds none; a spec that
  # needs a Workflow stores and publishes its own.
  workflows:
    enabled: true
  # Data Stores are on: an agent's first save makes one, and its page publishes it (NAV-2).
  # Their Secret Store key and file storage are below.
  dataStores:
    enabled: true
  # Personal API keys are on: You > API keys issues one with the scopes a person ticks.
  personalApiKeys:
    enabled: true
  # Projects are on: the projects spec makes a shared and a private one.
  projects:
    enabled: true
  # Feedback is on: the feedback spec sends a comment from a published App and on a Workflow's
  # result, and a reviewer reads both in the Inbox.
  feedback:
    enabled: true
# The addresses a Connection of the suite may reach. Nothing listens on the first and the `test`
# connector type contacts nothing: the entry is what lets a test of a Connection answer ready.
# The second is replaced by the runner with free loopback ports for the sample MCP servers
# that connection-editor starts, so an orphaned child cannot monopolize the next test's port.
# The third is the sample OAuth server at the address the demo's `sample-oauth` entry fixes.
egress:
  allow:
    - { protocol: https, host: 127.0.0.1, port: 8443, network: private, cidrs: [127.0.0.0/8] }
    - { protocol: http, host: 127.0.0.1, port: 4219, network: private, cidrs: [127.0.0.0/8] }
    - {
        protocol: http,
        host: localhost,
        port: 8787,
        network: private,
        cidrs: [127.0.0.0/8, "::1/128"]
      }
# The demo's sample entry is offered; the suite's own `sample-files` is not, so it shows greyed.
catalogue:
  entries: [sample-accounting, sample-oauth]
# The key of the secrets of Connections made in the suite. The runner makes a new one per run.
secretStore:
  keys:
    - { id: e2e, ref: E2E_SECRET_STORE_KEY }
executionWorkspaces:
  enabled: true
infrastructure:
  models:
    local:
      provider: deterministic
      # A personal Connection is called only where every model route says eu (MODEL-REGION-1).
      region: eu
  objectStorage:
    files:
      provider: filesystem
      root: .tmp/e2e/files
    workspaces:
      provider: filesystem
      root: .tmp/e2e/workspaces
  sandbox:
    provider: local
modelBindings:
  - id: primary
    providerId: local
    model: deterministic-local
usage:
  budget: {}
  safeguards:
    modelCallsPerDay: 500
    tokensPerDay: 25000000
    tokensPerMonth: 250000000
  costs:
    customer:
      id: e2e-customer
      version: "1"
      currency: EUR
      models:
        - providerId: local
          model: deterministic-local
          uncachedInputPricePerMillionTokens: 0
          cachedInputPricePerMillionTokens: 0
          outputPricePerMillionTokens: 0
tools:
  - name: read_skill
    enabled: true
  - name: propose_skill_change
    enabled: true
  - name: show_view
    enabled: true
  # An agent writes a Page with the file tools and saves it.
  - name: workspace.write_file
    enabled: true
  - name: workspace.open
    enabled: true
  - name: demo.workflow_summary
    enabled: true
  - name: demo.weather_forecast
    enabled: true
  # A fixture of the browser suite, brought by clients/demo/src/e2e-server.ts.
  - name: e2e.record_note
    enabled: true
  - name: e2e.confirm_note
    enabled: true
  - name: e2e.confirm_reversible
    enabled: true
ui:
  clientName: E2E Customer
  title: Workshape Catalyst E2E
  welcomeMessage: E2E ready.
  # Shows the Documentation item of the account menu and the links into the documentation.
  docsUrl: https://docs.workshape.ai/catalyst

# The suite signs one account in from one address many times a minute, which no person does.
# Every other limit stays at its default, so a run would show a default that is too low.
rateLimits:
  signInPerAccountPerMinute: 1000
  signInPerAddressPerMinute: 3000
