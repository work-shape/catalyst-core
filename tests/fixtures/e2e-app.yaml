version: 1
clientInstance:
  id: demo-e2e
  displayName: Demo E2E Client Instance
  environment: development
auth:
  standalone:
    enabled: true
    baseUrl: http://127.0.0.1:4210/api/auth
    trustedOrigins:
      - http://127.0.0.1:5273
    seedUsers:
      - email: e2e-superadmin@example.test
        emailEnvName: E2E_SUPERADMIN_EMAIL
        displayLabel: E2E Superadmin
        passwordEnvName: E2E_SUPERADMIN_PASSWORD
        developmentPassword: e2e-superadmin-password
        roles:
          - user
          - admin
          - superadmin
        permissions:
          - config_assets.release
        permissionRefs:
          - demo-tools
      - email: e2e-user@example.test
        emailEnvName: E2E_USER_EMAIL
        displayLabel: E2E User
        passwordEnvName: E2E_USER_PASSWORD
        developmentPassword: e2e-user-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-admin@example.test
        emailEnvName: E2E_ADMIN_EMAIL
        displayLabel: E2E Admin
        passwordEnvName: E2E_ADMIN_PASSWORD
        developmentPassword: e2e-admin-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      # A member for each spec file that fills that member's conversation list or Inbox. Spec
      # files run side by side on this one instance, so a file that shared its member with
      # another pushed the other's rows out of the rail's cap.
      - email: e2e-views@example.test
        displayLabel: E2E Views
        passwordEnvName: E2E_VIEWS_PASSWORD
        developmentPassword: e2e-views-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-navigation@example.test
        displayLabel: E2E Navigation
        passwordEnvName: E2E_NAVIGATION_PASSWORD
        developmentPassword: e2e-navigation-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-inbox@example.test
        displayLabel: E2E Inbox
        passwordEnvName: E2E_INBOX_PASSWORD
        developmentPassword: e2e-inbox-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-pages@example.test
        displayLabel: E2E Pages
        passwordEnvName: E2E_PAGES_PASSWORD
        developmentPassword: e2e-pages-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The member the Connections spec grants a right to. No other spec uses this member.
      - email: e2e-connections@example.test
        displayLabel: E2E Connections
        passwordEnvName: E2E_CONNECTIONS_PASSWORD
        developmentPassword: e2e-connections-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The member the Workflow rights spec and the Workflow draft spec give rights to, one
      # after the other. No other spec uses this member.
      - email: e2e-workflow-rights@example.test
        displayLabel: E2E Zz Workflow Rights
        passwordEnvName: E2E_WORKFLOW_RIGHTS_PASSWORD
        developmentPassword: e2e-workflow-rights-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The member the Workflow start form spec gives rights to. No other spec uses this member.
      - email: e2e-workflow-start@example.test
        displayLabel: E2E Zz Workflow Start
        passwordEnvName: E2E_WORKFLOW_START_PASSWORD
        developmentPassword: e2e-workflow-start-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The three people of the Apps spec. No other spec uses them: the admin builds and
      # publishes, the member uses what is published, and the builder is the one the spec shows
      # the draft without the publish right. No grant gives a right on Apps yet, so the builder
      # is an admin too and the spec takes the right out of what the interface is told.
      - email: e2e-apps@example.test
        displayLabel: E2E Apps
        passwordEnvName: E2E_APPS_PASSWORD
        developmentPassword: e2e-apps-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      - email: e2e-apps-member@example.test
        displayLabel: E2E Apps Member
        passwordEnvName: E2E_APPS_MEMBER_PASSWORD
        developmentPassword: e2e-apps-member-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      - email: e2e-apps-builder@example.test
        displayLabel: E2E Apps Builder
        passwordEnvName: E2E_APPS_BUILDER_PASSWORD
        developmentPassword: e2e-apps-builder-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      # The person of the Update app spec. No other spec uses them: the spec saves an App, and
      # an App's id is taken once for the whole instance.
      - email: e2e-app-update@example.test
        displayLabel: Zz E2E App Update
        passwordEnvName: E2E_APP_UPDATE_PASSWORD
        developmentPassword: e2e-app-update-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      # The two people of the App actions spec. No other spec uses them: the admin writes and
      # publishes the App and may use its Connection through the role, and the member holds the
      # use right on the App alone until the spec grants the one on the Connection.
      # Their labels start with "Zz" on purpose: the users list is sorted by label and shows ten
      # rows a page, and `chat-standalone.spec.ts` looks for "E2E Superadmin", "E2E User" and a
      # person it creates as "E2E Reset ..." on the first page. A label that sorts before those
      # pushes them off it.
      - email: e2e-app-actions@example.test
        displayLabel: E2E Zz App Actions
        passwordEnvName: E2E_APP_ACTIONS_PASSWORD
        developmentPassword: e2e-app-actions-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      - email: e2e-app-actions-member@example.test
        displayLabel: E2E Zz App Actions Member
        passwordEnvName: E2E_APP_ACTIONS_MEMBER_PASSWORD
        developmentPassword: e2e-app-actions-member-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The two people of the App actions view spec, used by no other spec: the builder writes
      # the App, tests its action and reads its run, and the member holds none of the App's
      # rights. Their labels sort after every other for the reason given above.
      - email: e2e-app-actions-view@example.test
        displayLabel: E2E Zz App Actions View
        passwordEnvName: E2E_APP_ACTIONS_VIEW_PASSWORD
        developmentPassword: e2e-app-actions-view-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      - email: e2e-app-actions-view-member@example.test
        displayLabel: E2E Zz App Actions View Member
        passwordEnvName: E2E_APP_ACTIONS_VIEW_MEMBER_PASSWORD
        developmentPassword: e2e-app-actions-view-member-password
        roles:
          - user
        permissionRefs:
          - demo-tools
      # The two people of the App Workflow action spec, used by no other spec: the builder
      # writes the App and is given the use right on its Workflow, and the member holds no
      # right on the Workflow. Their labels sort after every other for the reason given above.
      - email: e2e-app-workflow@example.test
        displayLabel: E2E Zz App Workflow
        passwordEnvName: E2E_APP_WORKFLOW_PASSWORD
        developmentPassword: e2e-app-workflow-password
        roles:
          - user
          - admin
        permissionRefs:
          - demo-tools
      - email: e2e-app-workflow-member@example.test
        displayLabel: E2E Zz App Workflow Member
        passwordEnvName: E2E_APP_WORKFLOW_MEMBER_PASSWORD
        developmentPassword: e2e-app-workflow-member-password
        roles:
          - user
        permissionRefs:
          - demo-tools
  sessionToken:
    issuer: demo-e2e-client-instance
    ttlSeconds: 900
retention:
  conversationDays: 1
  auditDays: 30
  allowUserDelete: true
administration:
  agentConfiguration:
    enabled: true
    editableAgentFields:
      - displayName
      - description
      - welcomeMessage
      - welcomeSubtitle
      - instructions
      - modelBindingId
      - reasoningEffort
      - maxSteps
      - toolNames
      - skillNames
      - initialPrompts
    allowAgentCreation: true
    allowAgentDeletion: true
    allowDefaultAgentChange: true
    allowSkillEditing: true
    agentSkillChanges:
      enabled: true
      allowSkillCreation: true
# Pages are on: the specs about what a Page cannot reach need the route that serves one. A Page
# is saved from an Execution Workspace and built in its sandbox, so those are on too; the local
# sandbox runs the build as a process of the suite's workspace command worker.
modules:
  apps:
    enabled: true
  # Connections are on: Studio lists them and the Access page grants their rights. The suite's
  # server names one connector type, `test`, which contacts nothing.
  connections:
    enabled: true
  # Workflows are on: the Access page grants their rights. The suite seeds none; a spec that
  # needs a Workflow stores and publishes its own.
  workflows:
    enabled: true
# The one address a Connection of the suite may reach. Nothing listens there and the `test`
# connector type contacts nothing: the entry is what lets a test of a Connection answer ready.
egress:
  allow:
    - { protocol: https, host: 127.0.0.1, port: 8443, network: private, cidrs: [127.0.0.0/8] }
executionWorkspaces:
  enabled: true
infrastructure:
  models:
    local:
      provider: deterministic
  objectStorage:
    files:
      provider: filesystem
      root: .tmp/e2e/files
    workspaces:
      provider: filesystem
      root: .tmp/e2e/workspaces
  sandbox:
    provider: local
modelBindings:
  - id: primary
    providerId: local
    model: deterministic-local
usage:
  budget: {}
  safeguards:
    modelCallsPerDay: 500
    tokensPerDay: 25000000
    tokensPerMonth: 250000000
  costs:
    customer:
      id: e2e-customer
      version: "1"
      currency: EUR
      models:
        - providerId: local
          model: deterministic-local
          uncachedInputPricePerMillionTokens: 0
          cachedInputPricePerMillionTokens: 0
          outputPricePerMillionTokens: 0
tools:
  - name: read_skill
    enabled: true
  - name: propose_skill_change
    enabled: true
  - name: show_view
    enabled: true
  # An agent writes a Page with the file tools and saves it.
  - name: workspace.apply_patch
    enabled: true
  - name: workspace.write_file
    enabled: true
  - name: page.save
    enabled: true
  - name: demo.workflow_summary
    enabled: true
  - name: demo.weather_forecast
    enabled: true
  # A fixture of the browser suite, brought by clients/demo/src/e2e-server.ts.
  - name: e2e.record_note
    enabled: true
ui:
  clientName: E2E Customer
  title: Workshape Catalyst E2E
  welcomeMessage: E2E ready.
  # Shows the Documentation item of the account menu and the links into the documentation.
  docsUrl: https://docs.workshape.ai/catalyst

# The suite signs one account in from one address many times a minute, which no person does.
# Every other limit stays at its default, so a run would show a default that is too low.
rateLimits:
  signInPerAccountPerMinute: 1000
  signInPerAddressPerMinute: 3000
