id: with-condition
name: With a condition
description: Holds a reserved block, which no engine of this release runs.
runAs: workflow-runner
inputs: { type: object }
outputs: { type: object }
steps:
  - id: start
    name: Start by hand
    type: trigger
    triggers:
      - kind: manual
  - id: check
    name: Is there a note
    type: condition
    when:
      ref: { step: start, path: input.note }
      op: equals
      value: yes
    then:
      - id: read
        name: Read
        type: operation
        operation: connection.crm.echo
        input: {}
    else: []
  - id: result
    name: Result
    type: output
    input: {}
