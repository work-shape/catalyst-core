# The sharing specs' own people. The builder shares into a team where the spec grants building
# rights. The asker reads skills for everyone but only builds in their own workspace, so sharing
# with everyone needs an Inbox decision. The specs grant their remaining rights.
- email: e2e-share-move-builder@example.test
  displayLabel: E2E Zz Move Builder
  passwordEnvName: E2E_SHARE_MOVE_BUILDER_PASSWORD
  developmentPassword: e2e-share-move-builder-password
  roles:
    - user
  permissionRefs:
    - demo-tools
- email: e2e-share-move-asker@example.test
  displayLabel: E2E Zz Move Asker
  passwordEnvName: E2E_SHARE_MOVE_ASKER_PASSWORD
  developmentPassword: e2e-share-move-asker-password
  roles:
    - user
  permissions:
    - config_assets.read
  permissionRefs:
    - demo-tools
