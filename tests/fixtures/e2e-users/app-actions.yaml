# The two people of the App actions spec. No other spec uses them: the admin writes and
# publishes the App and may use its Connection through the role, and the member holds the
# use right on the App alone until the spec grants the one on the Connection.
# Their labels start with "Zz" for the reason in e2e-app.yaml.
- email: e2e-app-actions@example.test
  displayLabel: E2E Zz App Actions
  passwordEnvName: E2E_APP_ACTIONS_PASSWORD
  developmentPassword: e2e-app-actions-password
  roles:
    - user
    - admin
  permissionRefs:
    - demo-tools
- email: e2e-app-actions-member@example.test
  displayLabel: E2E Zz App Actions Member
  passwordEnvName: E2E_APP_ACTIONS_MEMBER_PASSWORD
  developmentPassword: e2e-app-actions-member-password
  roles:
    - user
  permissionRefs:
    - demo-tools
