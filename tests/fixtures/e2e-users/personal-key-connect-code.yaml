# would show up among the key's offered rights.
- email: e2e-key-connect@example.test
  displayLabel: E2E Zz Key Connect
  passwordEnvName: E2E_KEY_CONNECT_PASSWORD
  developmentPassword: e2e-key-connect-password
  roles:
    - user
  permissionRefs:
    - demo-tools
