# The two people of the conversation-gone spec: the reader opens addresses of conversations
# that are gone, one of them the other's. No other spec uses them.
- email: e2e-conversation-gone@example.test
  displayLabel: E2E Zz Conversation Gone
  passwordEnvName: E2E_CONVERSATION_GONE_PASSWORD
  developmentPassword: e2e-conversation-gone-password
  roles:
    - user
  permissionRefs:
    - demo-tools
- email: e2e-conversation-gone-other@example.test
  displayLabel: E2E Zz Conversation Gone Other
  passwordEnvName: E2E_CONVERSATION_GONE_OTHER_PASSWORD
  developmentPassword: e2e-conversation-gone-other-password
  roles:
    - user
  permissionRefs:
    - demo-tools
