name: Mirror images
# Keeps the images of .github/mirrored-images in the organisation's own registry, so that the
# checks of this repository, of the capabilities and of the deployments pull them from there.
# It runs when the list changes, once a week, and by hand. A run copies only what the registry
# does not hold under the digest of the list, so the weekly run pulls nothing and only proves
# that every copy is still there.
on:
  push:
    branches: [main]
    paths:
      - .github/mirrored-images
      - .github/scripts/mirror-images.sh
      - .github/workflows/mirror-images.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}
jobs:
  mirror:
    # A fork has no registry of this organisation to write to.
    if: github.repository == 'vivd-solutions/vivd-catalyst'
    # The script needs skopeo, which this runner image has.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Copy what the registry does not hold
        run: .github/scripts/mirror-images.sh .github/mirrored-images ghcr.io/vivd-solutions/mirror
