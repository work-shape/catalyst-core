name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('fresh-resolution-{0}', github.run_id) || 'npm-release' }}
  cancel-in-progress: false
jobs:
  fresh-resolution:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check
        with:
          build: "false"
      - name: Verify the fresh-resolution gate
        run: node --test scripts/release/fresh-resolution.test.mjs scripts/release/fresh-consumer-smoke.test.mjs scripts/release/dependency-ranges.test.mjs scripts/release/react-peers.test.mjs scripts/release/runtime-pins.test.mjs scripts/release/composer-probe.test.mjs
      - name: Build release packages from the frozen core lock
        run: pnpm -r --filter './packages/*' build
      - name: Chromium for the composer typing probe
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Sign in to the registry for the test Postgres image
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Throwaway database password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "FRESH_POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "POSTGRES_STORE_TEST_DATABASE_URL=postgresql://catalyst:$password@localhost:5432/catalyst_test" >> "$GITHUB_ENV"
      - name: Test Postgres
        run: .github/scripts/start-postgres.sh catalyst "$FRESH_POSTGRES_PASSWORD" catalyst_test 5432
      - name: Build a consumer with freshly resolved third-party ranges
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/release/check-fresh-resolution.mjs
      - name: Prove the gate rejects auth version drift
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release/check-fresh-resolution.mjs --prove-auth-drift
      - name: Remove test Postgres
        if: always()
        run: docker rm -f check-postgres || true
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: fresh-resolution
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: platform
          fetch-depth: 0
          persist-credentials: false
      - name: Tag, branch, versions and green Check
        id: release
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/context.mjs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Build, inspect packages and consumer, guard visibility
        working-directory: platform
        run: |
          pnpm install --frozen-lockfile
          pnpm release:guard
          pnpm release:check
          node scripts/release/notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
        env:
          VERSION: ${{ steps.release.outputs.version }}
          # A private repository's hosted runner has about 7 GB; building packages one at a
          # time keeps the type declaration builds inside it.
          npm_config_workspace_concurrency: "1"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: work-shape/catalyst
          ref: main
          path: public
          fetch-depth: 0
          ssh-key: ${{ secrets.PUBLIC_MIRROR_KEY }}
      - name: Mirror approved public source and tag
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/mirror.mjs ../public
      - name: Wait for all four public packages
        working-directory: platform
        run: pnpm release:publish --group public --wait
      - name: Publish restricted packages and check anonymous 404
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release:publish --group restricted
      - name: GitHub release (rerunnable)
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=()
            if [[ "$TAG" == *-rc.* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          fi
