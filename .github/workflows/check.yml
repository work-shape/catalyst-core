name: Check
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source-rulings-proof:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
        with:
          build: "false"
      - name: Build
        run: pnpm build
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Database
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      - name: Positive source regressions
        run: pnpm exec vitest run tests/knowledge-source-confirmation.test.ts tests/knowledge-source-upgrade.test.ts tests/knowledge-source-withdrawal.test.ts tests/knowledge-base-sources-contract.test.ts
      - name: Each deliberate break must fail its regression
        run: node .github/scripts/src3b-proof.mjs
      - name: No mutation left behind
        run: git diff --exit-code
