# Hosted Check on Blacksmith, for releases only: release/** pushes and release dispatches.
# Pull requests are checked by pr.yml on the Mac mini; the full suite runs in nightly.yml.
name: Check
on:
  workflow_dispatch:
  push:
    branches: ["release/**"]
permissions:
  contents: read
  packages: read
# A release-branch dispatch cancels the branch's earlier dispatch.
# Pushes get unique groups, including re-runs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/') && format('dispatch-{0}', github.ref)) || format('{0}-{1}-{2}', github.ref, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/') }}
jobs:
  policy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      - name: Enforce hosted Check policy
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 1
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*) ;;
            *)
              echo "::error::Hosted Check runs for releases only. Dispatch requires refs/heads/release/**; received $GITHUB_REF."
              exit 1
              ;;
          esac
  changes:
    needs: policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
        with:
          build: "false"
      - name: Check workflow policy
        run: node --test .github/scripts/check-policy.test.mjs
      - name: Changes
        run: pnpm check:changes
      - name: Format
        run: pnpm format:check
  build:
    needs: policy
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
        with:
          build: "false"
      - name: Build
        run: pnpm build
  static:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
      - name: Lint
        run: pnpm lint
      - name: Package types
        run: pnpm typecheck:packages
      - name: Test types
        run: pnpm typecheck:tests
      - name: OpenAPI
        run: pnpm check:openapi
      - name: Contract
        run: pnpm check:contract
      - name: Migrations
        run: pnpm check:migrations
  docs:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
      - name: Documentation types
        run: pnpm typecheck:docs
      - name: Documentation links, assets and search
        run: pnpm --filter @work-shape/catalyst-docs check:site
  tests:
    name: tests ${{ matrix.shard }}/4
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
      # Volume tests belong to the Mac mini nightly, not the release Check.
      CATALYST_SCALE_TESTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      - name: Unit and database tests
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --shard="$SHARD/4"
      - name: Deployment kit tests (once)
        if: matrix.shard == 1
        run: pnpm test:deployment-kit
  upgrade:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 17
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      - name: Upgrade from oldest supported release
        run: pnpm test:upgrade
      - name: Released database tests against this schema
        run: pnpm test:compatibility
  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-check
      - name: Release tooling regressions
        run: node --test 'scripts/release/*.test.mjs'
      - name: Packages are fit to publish
        run: pnpm release:check --skip-build
  # Builds the API and UI images of the demo client in the layout of a deployment's build
  # workspace, where only the client and what it depends on is installed. A package that uses
  # something only this repository's root declares passes `pnpm check` and fails here.
  # Locally it is `pnpm check:images`.
  #
  # The runner image it builds is kept, and the tests that need a Docker engine and that image
  # run against it: a command and a Page build in the container are not root, the worker
  # reads and removes what they wrote, and nothing a code step's script started outlives the
  # step, not even a process in a session of its own. They run twice. As the runner's own user, a worker that
  # is not root runs commands as itself. Under sudo the worker is root, as in a deployment: it
  # gives the workspace to the runner's fixed user and commands run as that user.
  images:
    needs: policy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
      RUNNER_IMAGE_TAG: catalyst-runner-under-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      # A BuildKit builder whose layer cache stays on Blacksmith between runs. It falls back to
      # the local builder when Blacksmith cannot set it up.
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # Every image of the job is a target of this one Dockerfile.
          cache-key: vivd-client.Dockerfile
      - name: Images
        run: bash scripts/check-image-build.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commands in the runner image, worker not root
        timeout-minutes: 5
        env:
          CATALYST_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_TAG }}
          CATALYST_PAGE_BUILD_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_TAG }}
        run: >-
          pnpm exec vitest run
          tests/docker-workspace-command-runner.test.ts tests/page-build-sandbox.test.ts tests/workflow-runner-packages-image.test.ts
          tests/workflow-code-step.test.ts
          -t "in the runner image|gives the workspace|through the job ends"
      - name: Commands in the runner image, worker root
        timeout-minutes: 5
        run: >-
          sudo env "PATH=$PATH"
          "POSTGRES_STORE_TEST_DATABASE_URL=$POSTGRES_STORE_TEST_DATABASE_URL"
          "CATALYST_RUNNER_IMAGE=$RUNNER_IMAGE_TAG"
          "CATALYST_PAGE_BUILD_RUNNER_IMAGE=$RUNNER_IMAGE_TAG"
          pnpm exec vitest run
          tests/docker-workspace-command-runner.test.ts tests/page-build-sandbox.test.ts tests/workflow-runner-packages-image.test.ts
          tests/workflow-code-step.test.ts
          -t "in the runner image|gives the workspace|through the job ends"
  browser-shard:
    name: browser ${{ matrix.shard }}/6
    needs: build
    # Six isolated databases amortize setup; one worker per database keeps shared accounts
    # and fixed-port beforeAll servers sequential.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 28
    # Must match @playwright/test in pnpm-lock.yaml (check-policy.test.mjs).
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    services:
      postgres:
        image: ghcr.io/work-shape/catalyst-postgres@sha256:c1d18197f1cfea501a124361bb4eeb90cf999ad82ab2dea87e66f3ce20eb3e0d
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: agent_chat
          POSTGRES_PASSWORD: agent_chat
          POSTGRES_DB: agent_chat
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username agent_chat --dbname agent_chat"
          --health-interval 5s --health-timeout 5s --health-retries 24
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-check
      # setup-check builds this commit; the runner migrates and starts the API and the
      # interface itself. A test that fails is tried once more; one that fails twice fails the job.
      - name: Browser suite
        shell: bash
        env:
          E2E_EXTERNAL_POSTGRES: "1"
          E2E_DATABASE_URL: postgres://agent_chat:agent_chat@postgres:5432/agent_chat
          E2E_SKIP_BUILD: "1"
          E2E_FULLY_PARALLEL: "1"
          SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e --retries=1 --reporter=./e2e/ci-reporter.ts --workers=1 --shard="$SHARD/6" 2>&1 | tee browser-run.log
      # A spec that keeps screenshots for review writes them as `evidence-<name>.png` in its
      # output folder; this one step uploads all of them.
      - name: Keep screenshot evidence
        if: ${{ !cancelled() && hashFiles('test-results/**/evidence-*.png') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: evidence-${{ matrix.shard }}
          path: test-results/**/evidence-*.png
          retention-days: 3
      - name: Keep traces and the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: browser-run-${{ matrix.shard }}
          path: |
            test-results/
            browser-run.log
          retention-days: 7
  # `browser` remains for existing check consumers; `check` is the stable aggregate.
  browser:
    needs: browser-shard
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Every browser shard passed
        env:
          SHARDS: ${{ needs.browser-shard.result }}
        run: test "$SHARDS" = success
  check:
    needs: [policy, changes, build, static, docs, tests, upgrade, release, images, browser-shard]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
