name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to a pull request cancels the run for the older push, so only its latest commit
# reports a result. Every run on main finishes: a merge that lands while the previous one is
# checked must not cancel that check, or a break on main goes unseen. A shared group would still
# drop a run that waits behind another, so each commit on main is a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # The suite alone takes about 26 minutes; 30 cancelled the last step on every PR.
    timeout-minutes: 45
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The baseline guard needs the history back to where the pull request left its base,
          # and the compatibility step needs the release tags and their trees.
          fetch-depth: 0
      # A step and not a service container: the script pulls the image by digest from the first
      # of three registries that serves it, where a service container has one registry and
      # fails the job when that one answers "toomanyrequests".
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      - name: Baseline counts may only fall
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node packages/quality-config/baseline-guard.mjs "$BASE" "$HEAD"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seconds, before the suite's half hour: a pull request whose migration number main gave
      # out in the meantime fails here with the steps to renumber. `pnpm check` runs it again.
      - name: Migrations
        run: pnpm check:migrations
      - run: pnpm check
      # Installs the previous and the oldest supported release from their tags and runs their
      # database tests against the schema of this commit, on the database started above. The
      # install reads the pnpm store that setup-node restored and fetches the rest.
      - name: Released database tests against this schema
        timeout-minutes: 10
        run: pnpm test:compatibility
      # Packs every publishable package, inspects the tarballs and installs them in a scratch
      # consumer. `pnpm check` built the packages in this job, so the build is not repeated.
      - name: Packages are fit to publish
        timeout-minutes: 5
        run: pnpm release:check --skip-build
  # Builds the API and UI images of the demo client in the layout of a deployment's build
  # workspace, where only the client and what it depends on is installed. A package that uses
  # something only this repository's root declares passes `pnpm check` and fails here.
  # Locally it is `pnpm check:images`.
  #
  # The runner image it builds is kept, and the tests that need a Docker engine and that image
  # run against it: a command and a Page build in the container are not root, and the worker
  # reads and removes what they wrote. They run twice. As the runner's own user, a worker that
  # is not root runs commands as itself. Under sudo the worker is root, as in a deployment: it
  # gives the workspace to the runner's fixed user and commands run as that user.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_STORE_TEST_DATABASE_URL: postgresql://catalyst:local-check@localhost:5432/catalyst_test
      RUNNER_IMAGE_TAG: catalyst-runner-under-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh catalyst local-check catalyst_test 5432
      - run: bash scripts/check-image-build.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commands in the runner image, worker not root
        timeout-minutes: 5
        env:
          CATALYST_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_TAG }}
          CATALYST_PAGE_BUILD_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_TAG }}
        run: >-
          pnpm exec vitest run
          tests/docker-workspace-command-runner.test.ts tests/page-build-sandbox.test.ts
          -t "in the runner image|gives the workspace"
      - name: Commands in the runner image, worker root
        timeout-minutes: 5
        run: >-
          sudo env "PATH=$PATH"
          "POSTGRES_STORE_TEST_DATABASE_URL=$POSTGRES_STORE_TEST_DATABASE_URL"
          "CATALYST_RUNNER_IMAGE=$RUNNER_IMAGE_TAG"
          "CATALYST_PAGE_BUILD_RUNNER_IMAGE=$RUNNER_IMAGE_TAG"
          pnpm exec vitest run
          tests/docker-workspace-command-runner.test.ts tests/page-build-sandbox.test.ts
          -t "in the runner image|gives the workspace"
  # The whole browser suite, beside the job above. It is not part of `pnpm check`, because it
  # needs a browser and ports of its own; locally it is `pnpm test:e2e`.
  browser:
    runs-on: ubuntu-latest
    # The job takes 15 minutes on an ordinary runner (2 to build, 12 for 296 tests) and 22 on a
    # runner that is 1.6 times slower, which the hosted pool hands out now and then.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The suite's own database, with the names its runner expects on its default port. The
      # runner would otherwise start `postgres:17` from Docker Hub, which rate-limits the runners.
      - name: Database
        timeout-minutes: 5
        run: .github/scripts/start-postgres.sh agent_chat agent_chat agent_chat 55433
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # With the cache restored this downloads nothing and only installs the system libraries.
      - name: Chromium and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # The runner builds what it serves, migrates the database and starts the API and the
      # interface itself. A test that fails is tried once more; one that fails twice fails the job.
      - name: Browser suite
        shell: bash
        env:
          E2E_EXTERNAL_POSTGRES: "1"
        run: pnpm test:e2e --retries=1 --reporter=list 2>&1 | tee browser-run.log
      - name: Keep traces and the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-run
          path: |
            test-results/
            browser-run.log
          retention-days: 7
