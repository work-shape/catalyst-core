# The check every pull request runs before it merges, on GitHub-hosted runners (free for a public
# repository). It never runs on a Blacksmith runner: those bill per minute and are for releases.
# The full browser suite, images, compatibility and scale tests run in nightly.yml instead.
name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "packages/docs/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
# Only the newest push of a pull request needs a result.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CATALYST_SCALE_TESTS: "0"
defaults:
  run:
    shell: bash
jobs:
  # The typed lint and Knip resolve workspace source; no compiled output is needed.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Runner
        run: |
          uname -mrs
          nproc
          free --bytes
          uptime
          docker info --format 'docker {{.ServerVersion}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes, {{.ContainersRunning}} containers running'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  # The compiler checks resolve workspace source through tsconfig aliases.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Runner
        run: |
          uname -mrs
          nproc
          free --bytes
          uptime
          docker info --format 'docker {{.ServerVersion}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes, {{.ContainersRunning}} containers running'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package types
        run: pnpm typecheck:packages
      - name: Test types
        run: pnpm typecheck:tests

  # Keep package and client build validation alongside the tooling checks.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Runner
        run: |
          uname -mrs
          nproc
          free --bytes
          uptime
          docker info --format 'docker {{.ServerVersion}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes, {{.ContainersRunning}} containers running'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Changes
        run: pnpm check:changes
      - name: Check workflow policy
        run: node --test .github/scripts/check-policy.test.mjs
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: OpenAPI and contract
        run: pnpm check:openapi && pnpm check:contract
      - name: Migrations
        run: pnpm check:migrations
      - name: Database
        timeout-minutes: 5
        env:
          TOKEN: ${{ github.token }}
        run: |
          name="pr-postgres-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          port=$(node -e 'const s = require("net").createServer().listen(0, "127.0.0.1", () => { console.log(s.address().port); s.close(); })')
          echo "CHECK_POSTGRES_NAME=$name" >> "$GITHUB_ENV"
          echo "POSTGRES_STORE_TEST_DATABASE_URL=postgresql://catalyst:local-check@127.0.0.1:$port/catalyst_test" >> "$GITHUB_ENV"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          CHECK_POSTGRES_NAME="$name" .github/scripts/start-postgres.sh catalyst local-check catalyst_test "$port"
      - name: Tooling tests
        run: pnpm test:tooling
      - name: Upgrade from oldest supported release
        run: pnpm test:upgrade
      - name: Deployment kit tests
        run: pnpm test:deployment-kit
      - name: Database log of a failed run
        if: failure()
        run: '[ -z "$CHECK_POSTGRES_NAME" ] || docker logs --tail 80 "$CHECK_POSTGRES_NAME" 2>&1 || true'
      - name: Remove the database
        if: always()
        run: '[ -z "$CHECK_POSTGRES_NAME" ] || docker rm --force "$CHECK_POSTGRES_NAME" >/dev/null 2>&1 || true'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one red run shows all of its failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: tests (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Runner
        run: |
          uname -mrs
          nproc
          free --bytes
          uptime
          docker info --format 'docker {{.ServerVersion}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes, {{.ContainersRunning}} containers running'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Database
        timeout-minutes: 5
        env:
          TOKEN: ${{ github.token }}
        run: |
          name="pr-postgres-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          port=$(node -e 'const s = require("net").createServer().listen(0, "127.0.0.1", () => { console.log(s.address().port); s.close(); })')
          echo "CHECK_POSTGRES_NAME=$name" >> "$GITHUB_ENV"
          echo "POSTGRES_STORE_TEST_DATABASE_URL=postgresql://catalyst:local-check@127.0.0.1:$port/catalyst_test" >> "$GITHUB_ENV"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          CHECK_POSTGRES_NAME="$name" .github/scripts/start-postgres.sh catalyst local-check catalyst_test "$port"
      - name: Unit and database tests
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/8
      - name: Database log of a failed run
        if: failure()
        run: '[ -z "$CHECK_POSTGRES_NAME" ] || docker logs --tail 80 "$CHECK_POSTGRES_NAME" 2>&1 || true'
      - name: Remove the database
        if: always()
        run: '[ -z "$CHECK_POSTGRES_NAME" ] || docker rm --force "$CHECK_POSTGRES_NAME" >/dev/null 2>&1 || true'

  # The one name branch protection requires: green only when every job above is.
  check:
    if: always()
    needs: [lint, types, tooling, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null \
            || { echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }

  preview-capture:
    name: preview capture isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @work-shape/catalyst-asset-schemas build
      - run: pnpm --filter @work-shape/catalyst-asset-schemas pack --out packages/preview-capture/schemas.tgz
      - run: pnpm --filter @work-shape/catalyst-core build
      - run: pnpm --filter @work-shape/catalyst-core pack --out packages/preview-capture/core.tgz
      - run: pnpm --filter @work-shape/catalyst-preview-capture build
      - run: docker build -t catalyst-srv1-preview-capture packages/preview-capture
      - run: node tests/support/build-capture-fixture.mjs
      - run: pnpm exec vitest run tests/preview-capture-service.browser.test.ts
        env:
          CAPTURE_BROWSER_TESTS: "1"
      - name: Capture proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-capture-proof
          path: .tmp/capture-proof/
          include-hidden-files: true
          if-no-files-found: error
