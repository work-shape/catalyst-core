name: Set up a check consumer
description: Install from the pnpm cache and optionally restore this run's shared build.
inputs:
  build:
    description: Restore the cached build produced by this run.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    # No restore keys: another run or commit must never supply this build.
    - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      id: build-cache
      if: inputs.build == 'true'
      with:
        path: /tmp/check-build.tgz
        key: check-build-${{ github.run_id }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Restore build
      if: inputs.build == 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
      run: |
        test "$CACHE_HIT" = true
        tar -xzf /tmp/check-build.tgz
