name: Set up a check consumer
description: Install from the pnpm cache and optionally build this commit.
inputs:
  build:
    description: Build this commit before the job's steps.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    # Each job builds this run's commit itself. The build is not shared through an artifact:
    # artifact storage counts against the organisation's monthly Actions storage, and the
    # release Check must not stop when that runs out.
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: pnpm build
