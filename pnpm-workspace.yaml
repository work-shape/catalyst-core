packages:
  - "packages/*"
  - "clients/*"

# One zod for every package and every dependency. Two versions make schemas of one package
# fail the types of another, and a caret range lets a new package resolve the newer one.
overrides:
  zod: 4.4.3
  "@fastify/busboy@^3": 3.2.2
  seroval@^1: 1.6.9
  find-my-way@^9: 9.7.0
  fast-uri@^3: 3.1.8
  # Univer 0.25 pins nanoid 5.1.11 exactly (GHSA-28wg-ghj8-5hjv); drop with the move to Univer 1.
  "@univerjs/core>nanoid": 5.1.16
