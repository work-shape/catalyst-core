<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <style>
      /* The colours of the documentation site, which are the application's default theme. */
      :root {
        color-scheme: light dark;
        --surface: #fdfbf7;
        --text: #201c17;
        --link: #8c3f26;
        --ring: #b5573a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #1c1a17;
          --text: #efebe4;
          --link: #e8ab90;
          --ring: #d98c6c;
        }
      }
      body {
        background: var(--surface);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.65;
        margin: 15vh auto;
        max-width: 32rem;
        padding: 0 1rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.25;
      }
      a {
        color: var(--link);
        text-underline-offset: 0.15em;
      }
      a:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>
      There is no page at this address. The Workshape Catalyst documentation is at
      <a href="/catalyst/">/catalyst/</a>.
    </p>
  </body>
</html>
