x-client-build-args: &client-build-args
  APP_PACKAGE: "@vivd-catalyst/demo"
  SERVER_ENTRY: clients/demo/dist/server.js
  ARTIFACT_PREVIEW_WORKER_ENTRY: clients/demo/dist/artifact-preview-worker.js
  UI_PACKAGE: "@vivd-catalyst/demo"
  UI_DIST_DIR: clients/demo/dist/client
  NGINX_CONFIG_PATH: docker/nginx-spa.conf
  VITE_CHAT_API_URL: ${VITE_CHAT_API_URL:-}
  VITE_CHAT_API_PORT: ${VITE_CHAT_API_PORT:-4100}

x-client-build: &client-build
  context: ../..
  dockerfile: docker/vivd-client.Dockerfile
  args:
    <<: *client-build-args

x-watch-ignore: &watch-ignore
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.venv/**"
  - "**/.vite/**"
  - "**/.astro/**"

x-demo-api-watch-ignore: &demo-api-watch-ignore
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.venv/**"
  - "**/.vite/**"
  - "**/.astro/**"
  - "src/chat-main.tsx"
  - "src/styles.css"
  - "sample-mcp/**"
  - "src/sample-mcp-server.ts"
  - "widgets/**"
  - "public/**"
  - "index.html"
  - "vite.config.ts"

x-backend-package-watch-ignore: &backend-package-watch-ignore
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.venv/**"
  - "**/.vite/**"
  - "**/.astro/**"
  - "chat-standalone/**"
  - "chat-ui/**"
  - "ui/**"
  - "chat-widget/**"
  - "docs/**"

x-app-environment: &app-environment
  CLIENT_CONFIG_PATH: /app/clients/demo/config/app.yaml
  DATABASE_URL: postgres://agent_chat:agent_chat@postgres:5432/agent_chat
  CHAT_SESSION_TOKEN_SECRET: ${CHAT_SESSION_TOKEN_SECRET:-replace-with-at-least-24-random-characters}
  CHAT_SERVER_CREDENTIAL: ${CHAT_SERVER_CREDENTIAL:-replace-with-a-server-to-server-secret}
  SERVICE_ACCESS_TOKEN_SECRET: ${SERVICE_ACCESS_TOKEN_SECRET:-replace-with-at-least-32-random-characters}

x-workspace-command-worker-environment: &workspace-command-worker-environment
  CLIENT_CONFIG_PATH: /app/clients/demo/config/app.yaml
  DATABASE_URL: postgres://agent_chat:agent_chat@postgres:5432/agent_chat
  WORKSPACE_COMMAND_WORKER_ID: demo-workspace-command-worker
  EXECUTION_WORKSPACE_RUNNER_IMAGE: ${WORKSPACE_COMMAND_RUNNER_IMAGE:-vivd-catalyst-demo-workspace-command-runner:local}
  # The Docker engine mounts a command's directory by its path on the host, so the worker
  # sees this directory under the same path as the host does.
  WORKSPACE_COMMAND_TEMP_ROOT: ${WORKSPACE_COMMAND_HOST_ROOT:-/tmp/vivd-catalyst-demo-execution-workspaces}/runner-tmp

x-artifact-preview-worker-environment: &artifact-preview-worker-environment
  CLIENT_CONFIG_PATH: /app/clients/demo/config/app.yaml
  DATABASE_URL: postgres://agent_chat:agent_chat@postgres:5432/agent_chat
  ARTIFACT_PREVIEW_TEMP_ROOT: /var/lib/vivd-catalyst/demo/artifact-preview-tmp
  ARTIFACT_PREVIEW_WORKER_ID: demo-artifact-preview-worker
  ARTIFACT_PREVIEW_CONCURRENCY: ${ARTIFACT_PREVIEW_CONCURRENCY:-1}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: agent_chat
      POSTGRES_PASSWORD: agent_chat
      POSTGRES_DB: agent_chat
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_chat -d agent_chat"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      <<: *client-build
      target: api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
    command: ["node", "clients/demo/dist/migrate.js"]

  api:
    build:
      <<: *client-build
      target: api
    # The job worker in the API takes up to 20 seconds to give its jobs back on SIGTERM.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
      HOST: 0.0.0.0
      PORT: 4100
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Generated by `pnpm dev` into `.env`. Neither has a default: the API stops at start
      # without the Secret Store key, and the Connection stays unconfigured without the other.
      DEMO_SECRET_STORE_KEY: ${DEMO_SECRET_STORE_KEY:-}
      DEMO_SAMPLE_MCP_KEY: ${DEMO_SAMPLE_MCP_KEY:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:4100/api/auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-at-least-32-random-characters}
      CHAT_UI_ORIGIN: ${CHAT_UI_ORIGIN:-http://127.0.0.1:5173}
      DEMO_SUPERADMIN_EMAIL: ${DEMO_SUPERADMIN_EMAIL:-superadmin@example.test}
      DEMO_SUPERADMIN_PASSWORD: ${DEMO_SUPERADMIN_PASSWORD:-demo-superadmin-password}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-user@example.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-user-password}
    ports:
      - "${API_HOST_PORT:-4100}:4100"
    volumes:
      - execution-workspace-objects:/var/lib/vivd-catalyst/demo/execution-workspaces
      - page-files:/var/lib/vivd-catalyst/demo/files
    develop:
      watch:
        - action: rebuild
          path: ../../clients/demo
          ignore: *demo-api-watch-ignore
        - action: rebuild
          path: ../../packages
          ignore: *backend-package-watch-ignore
        - action: rebuild
          path: ../../packages
          include: "**/package.json"
          ignore: *watch-ignore
        - action: rebuild
          path: ../../docker
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 12

  sample-mcp:
    build:
      <<: *client-build
      target: api
    command: ["node", "clients/demo/dist/sample-mcp-server.js"]
    environment:
      # The server refuses to start without DEMO_SAMPLE_MCP_KEY.
      DEMO_SAMPLE_MCP_KEY: ${DEMO_SAMPLE_MCP_KEY:-}
      PORT: 8787
      HOST: 0.0.0.0
    expose: ["8787"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: ../../clients/demo/sample-mcp
        - action: rebuild
          path: ../../clients/demo/src/sample-mcp-server.ts
        - action: rebuild
          path: ../../clients/demo/package.json
        - action: rebuild
          path: ../../docker
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml

  # Builds the image the Docker sandbox starts a container from for each command and each Page
  # build. The service itself runs nothing.
  workspace-command-runner:
    image: ${WORKSPACE_COMMAND_RUNNER_IMAGE:-vivd-catalyst-demo-workspace-command-runner:local}
    build:
      <<: *client-build
      target: workspace-command-runner
    command: ["true"]

  workspace-command-worker:
    build:
      <<: *client-build
      target: workspace-command-worker
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      workspace-command-runner:
        condition: service_completed_successfully
    environment:
      <<: *workspace-command-worker-environment
    command: ["node", "clients/demo/dist/workspace-command-worker.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_COMMAND_HOST_ROOT:-/tmp/vivd-catalyst-demo-execution-workspaces}:${WORKSPACE_COMMAND_HOST_ROOT:-/tmp/vivd-catalyst-demo-execution-workspaces}
      - execution-workspace-objects:/var/lib/vivd-catalyst/demo/execution-workspaces
      - page-files:/var/lib/vivd-catalyst/demo/files
    develop:
      watch:
        - action: rebuild
          path: ../../clients/demo
          ignore: *demo-api-watch-ignore
        - action: rebuild
          path: ../../packages
          ignore: *backend-package-watch-ignore
        - action: rebuild
          path: ../../packages
          include: "**/package.json"
          ignore: *watch-ignore
        - action: rebuild
          path: ../../docker
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml

  artifact-preview-worker:
    build:
      <<: *client-build
      target: artifact-preview-worker
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *artifact-preview-worker-environment
    volumes:
      - execution-workspace-objects:/var/lib/vivd-catalyst/demo/execution-workspaces
      - artifact-preview-tmp:/var/lib/vivd-catalyst/demo/artifact-preview-tmp
    develop:
      watch:
        - action: rebuild
          path: ../../clients/demo
          ignore: *demo-api-watch-ignore
        - action: rebuild
          path: ../../packages
          ignore: *backend-package-watch-ignore
        - action: rebuild
          path: ../../packages
          include: "**/package.json"
          ignore: *watch-ignore
        - action: rebuild
          path: ../../docker
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml

  ui:
    build:
      <<: *client-build
      target: ui-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_HOST_PORT:-5173}:5173"
    develop:
      watch:
        - action: sync
          path: ../../clients/demo/src
          target: /app/clients/demo/src
          ignore: *watch-ignore
        - action: sync
          path: ../../clients/demo/widgets
          target: /app/clients/demo/widgets
          ignore: *watch-ignore
        - action: sync
          path: ../../clients/demo/public
          target: /app/clients/demo/public
          ignore: *watch-ignore
        - action: sync
          path: ../../clients/demo/index.html
          target: /app/clients/demo/index.html
        - action: sync
          path: ../../packages/chat-ui/src
          target: /app/packages/chat-ui/src
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/ui/src
          target: /app/packages/ui/src
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/api-client/src
          target: /app/packages/api-client/src
          initial_sync: true
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/api-contract/src
          target: /app/packages/api-contract/src
          initial_sync: true
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/asset-schemas/src
          target: /app/packages/asset-schemas/src
          initial_sync: true
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/core/src
          target: /app/packages/core/src
          initial_sync: true
          ignore: *watch-ignore
        - action: sync
          path: ../../packages/config-schema/src
          target: /app/packages/config-schema/src
          initial_sync: true
          ignore: *watch-ignore
        - action: rebuild
          path: ../../clients/demo/package.json
        - action: rebuild
          path: ../../clients/demo/tsconfig.json
        - action: rebuild
          path: ../../clients/demo/vite.config.ts
        - action: rebuild
          path: ../../packages
          include: "**/package.json"
          ignore: *watch-ignore
        - action: rebuild
          path: ../../packages/chat-ui/tsconfig.json
        - action: rebuild
          path: ../../docker
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../pnpm-workspace.yaml

volumes:
  postgres-data:
  execution-workspace-objects:
  page-files:
  artifact-preview-tmp:
