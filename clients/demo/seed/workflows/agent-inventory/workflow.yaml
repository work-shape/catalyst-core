# A Workflow of the demo that needs nothing outside the instance: it lists the agents and reads
# each of them in a loop. It runs as the service principal `workflow-demo`, which the seed
# creates with the right to read agents and skills and nothing else.
id: agent-inventory
name: Agent inventory
description: Lists the agents of this instance and reads each of them, one after the other.
runAs: workflow-demo
inputs:
  type: object
  additionalProperties: false
outputs:
  type: object
  properties:
    read:
      type: integer
    failed:
      type: integer
  required: [read, failed]
steps:
  - id: start
    name: Start by hand
    type: trigger
    triggers:
      - kind: manual
  - id: agents
    name: List the agents
    type: operation
    operation: assets.list
    input:
      kind:
        value: agent
  - id: each_agent
    name: For each agent
    type: loop
    items: { step: agents, path: items }
    itemName: agent
    itemLabel: name
    onItemFailure: continue
    steps:
      - id: read
        name: Read the agent
        type: operation
        operation: assets.get
        input:
          kind:
            value: agent
          name:
            ref: { step: each_agent, path: name }
  - id: result
    name: Result
    type: output
    input:
      # A loop returns how many of its items ended how, and never what an item returned.
      read:
        ref: { step: each_agent, path: done }
      failed:
        ref: { step: each_agent, path: failed }
