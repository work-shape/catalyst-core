# The agents and skills of the demo's test company. `pnpm demo:seed` pushes this working copy;
# it is separate from the demo's own working copy one directory up, so `pnpm config:push`
# there neither brings nor removes these.
instances:
  local:
    url: "http://127.0.0.1:4100"
defaultInstance: local
agents:
  - "agents/*.agent.yaml"
skills:
  - "skills/*/SKILL.md"
